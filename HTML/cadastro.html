<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mini Rede Social | Cadastro</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <nav class="navbar navbar-expand-lg border-bottom sticky-top bg-body-tertiary">
    <div class="container">
      <a class="navbar-brand fw-bold" href="home.html">Mini Rede</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipal">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="menuPrincipal">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item"><a data-nav class="nav-link" href="home.html">Home</a></li>
          <li class="nav-item"><a data-nav class="nav-link" href="feed.html">Comentarios / Feed</a></li>
          <li class="nav-item"><a data-nav class="nav-link" href="login.html">Login</a></li>
          <li class="nav-item"><a data-nav class="nav-link" href="cadastro.html">Cadastro</a></li>
        </ul>
        <button class="btn btn-outline-secondary btn-sm" data-theme-toggle>Tema</button>
      </div>
    </div>
  </nav>

  <main class="container py-5">
    <div class="row justify-content-center">
      <div class="col-lg-8">
        <section class="card shadow-sm border-0">
          <div class="card-body p-4 p-md-5">
            <h1 class="h3 mb-3">Criar conta</h1>
            <p class="text-secondary">Cadastro de usuario com dados de perfil inicial.</p>

            <form id="cadastroForm" class="row g-3">
              <div class="col-md-6">
                <label class="form-label" for="username">Nome de usuario</label>
                <input class="form-control" id="username" required />
              </div>
              <div class="col-md-6">
                <label class="form-label" for="email">Email</label>
                <input class="form-control" type="email" id="email" required />
              </div>
              <div class="col-md-6">
                <label class="form-label" for="senha">Senha</label>
                <input class="form-control" type="password" id="senha" required minlength="6" />
              </div>
              <div class="col-md-6">
                <label class="form-label" for="fotoArquivo">Foto de perfil</label>
                <input class="form-control" type="file" id="fotoArquivo" accept="image/*" />
              </div>
              <div class="col-12">
                <img id="previewFoto" src="" alt="Pre-visualizacao da foto" class="rounded-circle border" style="width:72px;height:72px;object-fit:cover;display:none" />
              </div>
              <div class="col-12">
                <label class="form-label" for="bio">Bio</label>
                <textarea class="form-control" id="bio" rows="3"></textarea>
              </div>
              <div class="col-12">
                <label class="form-label" for="interesses">Interesses</label>
                <input class="form-control" id="interesses" placeholder="Ex: futebol, games, tecnologia" />
              </div>
              <div class="col-12">
                <button class="btn btn-accent" type="submit">Cadastrar</button>
              </div>
            </form>

            <div id="feedback" class="small mt-3"></div>
          </div>
        </section>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="app.js"></script>
  <script>
    MiniSocial.setupThemeControls();
    MiniSocial.setActiveNav();

    function fileToDataUrl(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(String(reader.result || ''));
        reader.onerror = () => reject(new Error('Falha ao ler a imagem.'));
        reader.readAsDataURL(file);
      });
    }

    const arquivoInput = document.getElementById('fotoArquivo');
    const preview = document.getElementById('previewFoto');

    arquivoInput.addEventListener('change', async function () {
      const file = arquivoInput.files && arquivoInput.files[0];
      if (!file) {
        preview.style.display = 'none';
        return;
      }

      try {
        const dataUrl = await fileToDataUrl(file);
        preview.src = dataUrl;
        preview.style.display = '';
      } catch {
        preview.style.display = 'none';
      }
    });

    document.getElementById('cadastroForm').addEventListener('submit', async function (event) {
      event.preventDefault();

      const feedback = document.getElementById('feedback');
      let photoValue = '';
      const photoFile = arquivoInput.files && arquivoInput.files[0];

      if (photoFile) {
        try {
          photoValue = await fileToDataUrl(photoFile);
        } catch {
          feedback.className = 'text-danger small mt-3';
          feedback.textContent = 'Nao foi possivel carregar a imagem selecionada.';
          return;
        }
      }

      const payload = {
        username: document.getElementById('username').value.trim(),
        email: document.getElementById('email').value.trim(),
        password: document.getElementById('senha').value,
        photo: photoValue,
        bio: document.getElementById('bio').value.trim(),
        interests: document.getElementById('interesses').value.trim()
      };

      const result = MiniSocial.registerUser(payload);
      if (!result.ok) {
        feedback.className = 'text-danger small mt-3';
        feedback.textContent = result.message;
        return;
      }

      feedback.className = 'text-success small mt-3';
      feedback.textContent = 'Cadastro realizado. Redirecionando para o perfil...';
      setTimeout(() => {
        window.location.href = 'perfil.html';
      }, 600);
    });
  </script>
</body>
</html>
