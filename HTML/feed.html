<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mini Rede Social | Feed</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <nav class="navbar navbar-expand-lg border-bottom sticky-top bg-body-tertiary">
    <div class="container">
      <a class="navbar-brand fw-bold" href="home.html">Mini Rede</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipal">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="menuPrincipal">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item"><a data-nav class="nav-link" href="home.html">Home</a></li>
          <li class="nav-item"><a data-nav class="nav-link" href="feed.html">Comentarios / Feed</a></li>
          <li class="nav-item when-user" style="display:none"><a data-nav class="nav-link" href="perfil.html">Perfil</a></li>
          <li class="nav-item when-user" style="display:none"><a data-nav class="nav-link" href="configuracao.html">Configuracao</a></li>
          <li class="nav-item when-guest"><a data-nav class="nav-link" href="login.html">Login</a></li>
          <li class="nav-item when-guest"><a data-nav class="nav-link" href="cadastro.html">Cadastro</a></li>
        </ul>
        <div class="d-flex gap-2 align-items-center">
          <button class="btn btn-outline-secondary btn-sm" data-theme-toggle>Tema</button>
          <span class="small text-secondary when-user" style="display:none">Ola, <strong data-user-name></strong></span>
          <button class="btn btn-danger btn-sm when-user" style="display:none" data-logout>Sair</button>
        </div>
      </div>
    </div>
  </nav>

  <main class="container py-4">
    <div class="row g-4">
      <div class="col-lg-5">
        <section class="card border-0 shadow-sm">
          <div class="card-body">
            <h1 class="h5">Novo comentario</h1>
            <p class="small text-secondary">Comentario relacionado ao perfil do usuario logado.</p>
            <form id="commentForm" class="vstack gap-3">
              <div>
                <label class="form-label" for="mensagem">Mensagem</label>
                <textarea class="form-control" id="mensagem" rows="4" placeholder="Escreva seu comentario" required></textarea>
              </div>
              <button class="btn btn-accent" type="submit">Publicar</button>
            </form>
            <div id="feedback" class="small mt-3"></div>
          </div>
        </section>
      </div>

      <div class="col-lg-7">
        <section class="d-flex justify-content-between align-items-center mb-2">
          <h2 class="h5 mb-0">Feed de comentarios</h2>
          <button class="btn btn-sm btn-outline-secondary" id="recarregar">Atualizar</button>
        </section>
        <div id="listaComentarios" class="vstack gap-3"></div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="server.js"></script>
  <script>
    MiniSocial.setupThemeControls();
    MiniSocial.renderAuthState();
    MiniSocial.setActiveNav();

    const feedback = document.getElementById('feedback');
    const form = document.getElementById('commentForm');
    const messageField = document.getElementById('mensagem');
    const list = document.getElementById('listaComentarios');

    function renderComments() {
      const comments = MiniSocial.getComments();
      list.innerHTML = comments.map((item) => {
        const author = MiniSocial.getUserById(item.authorId);
        const authorPhoto = MiniSocial.getProfilePhotoUrl(author);
        return `
          <article class="card border-0 shadow-sm">
            <div class="card-body">
              <div class="d-flex justify-content-between flex-wrap gap-2">
                <div class="d-flex align-items-center gap-2">
                  <img src="${authorPhoto}" alt="Foto de ${item.authorName}" style="width:36px;height:36px;object-fit:cover;border-radius:50%" />
                  <strong>${item.authorName}</strong>
                </div>
                <span class="small text-secondary">${MiniSocial.formatDate(item.createdAt)}</span>
              </div>
              <p class="mb-0 mt-2">${item.text}</p>
              <span class="badge text-bg-secondary mt-3">Perfil ID: ${item.authorId}</span>
            </div>
          </article>`;
      }).join('');
    }

    form.addEventListener('submit', function (event) {
      event.preventDefault();
      const message = messageField.value.trim();
      if (!message) {
        feedback.className = 'text-danger small mt-3';
        feedback.textContent = 'Digite uma mensagem.';
        return;
      }

      const result = MiniSocial.addComment(message);
      if (!result.ok) {
        feedback.className = 'text-danger small mt-3';
        feedback.textContent = result.message;
        return;
      }

      feedback.className = 'text-success small mt-3';
      feedback.textContent = 'Comentario publicado com sucesso.';
      messageField.value = '';
      renderComments();
    });

    document.getElementById('recarregar').addEventListener('click', renderComments);
    renderComments();
  </script>
</body>
</html>
