<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mini Rede Social | Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <nav class="navbar navbar-expand-lg border-bottom sticky-top bg-body-tertiary">
    <div class="container">
      <a class="navbar-brand fw-bold" href="home.html">Mini Rede</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipal">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="menuPrincipal">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item"><a data-nav class="nav-link" href="home.html">Home</a></li>
          <li class="nav-item"><a data-nav class="nav-link" href="feed.html">Comentarios / Feed</a></li>
          <li class="nav-item"><a data-nav class="nav-link" href="login.html">Login</a></li>
          <li class="nav-item"><a data-nav class="nav-link" href="cadastro.html">Cadastro</a></li>
        </ul>
        <button class="btn btn-outline-secondary btn-sm" data-theme-toggle>Tema</button>
      </div>
    </div>
  </nav>

  <main class="container py-5">
    <div class="row justify-content-center">
      <div class="col-sm-10 col-md-7 col-lg-5">
        <section class="card shadow-sm border-0">
          <div class="card-body p-4">
            <h1 class="h3 mb-3">Entrar</h1>
            <p class="text-secondary">Use seu email e senha para acessar.</p>

            <form id="loginForm" class="vstack gap-3">
              <div>
                <label class="form-label" for="email">Email</label>
                <input class="form-control" type="email" id="email" required />
              </div>
              <div>
                <label class="form-label" for="senha">Senha</label>
                <input class="form-control" type="password" id="senha" required minlength="6" />
              </div>
              <button class="btn btn-accent w-100" type="submit">Entrar</button>
            </form>

            <div id="feedback" class="small mt-3"></div>
            <p class="mt-3 mb-0">Nao tem conta? <a href="cadastro.html">Cadastre-se</a></p>
          </div>
        </section>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="server.js"></script>
  <script>
    MiniSocial.setupThemeControls();
    MiniSocial.setActiveNav();

    document.getElementById('loginForm').addEventListener('submit', function (event) {
      event.preventDefault();
      const email = document.getElementById('email').value.trim();
      const senha = document.getElementById('senha').value;
      const feedback = document.getElementById('feedback');

      const result = MiniSocial.login(email, senha);
      if (!result.ok) {
        feedback.className = 'text-danger small mt-3';
        feedback.textContent = result.message;
        return;
      }

      feedback.className = 'text-success small mt-3';
      feedback.textContent = 'Login realizado com sucesso. Redirecionando...';
      setTimeout(() => {
        window.location.href = 'perfil.html';
      }, 500);
    });
  </script>
</body>
</html>
