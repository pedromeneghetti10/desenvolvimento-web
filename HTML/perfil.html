<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mini Rede Social | Perfil</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <nav class="navbar navbar-expand-lg border-bottom sticky-top bg-body-tertiary">
    <div class="container">
      <a class="navbar-brand fw-bold" href="home.html">Mini Rede</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipal">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="menuPrincipal">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item"><a data-nav class="nav-link" href="home.html">Home</a></li>
          <li class="nav-item"><a data-nav class="nav-link" href="feed.html">Comentarios / Feed</a></li>
          <li class="nav-item"><a data-nav class="nav-link" href="perfil.html">Perfil</a></li>
          <li class="nav-item"><a data-nav class="nav-link" href="configuracao.html">Configuracao</a></li>
        </ul>
        <div class="d-flex gap-2 align-items-center">
          <button class="btn btn-outline-secondary btn-sm" data-theme-toggle>Tema</button>
          <span class="small text-secondary">Ola, <strong data-user-name></strong></span>
          <button class="btn btn-danger btn-sm" data-logout>Sair</button>
        </div>
      </div>
    </div>
  </nav>

  <main class="container py-4">
    <div class="row g-4">
      <div class="col-lg-4">
        <section class="card border-0 shadow-sm h-100">
          <div class="card-body text-center">
            <img id="fotoPerfil" class="profile-photo mb-3" alt="Foto de perfil" />
            <h1 class="h4 mb-1" id="nomePerfil"></h1>
            <p class="text-secondary mb-0" id="emailPerfil"></p>
          </div>
        </section>
      </div>
      <div class="col-lg-8">
        <section class="card border-0 shadow-sm mb-3">
          <div class="card-body">
            <h2 class="h5">Bio</h2>
            <p class="mb-0" id="bioPerfil"></p>
          </div>
        </section>
        <section class="card border-0 shadow-sm mb-3">
          <div class="card-body">
            <h2 class="h5">Interesses</h2>
            <p class="mb-0" id="interessesPerfil"></p>
          </div>
        </section>
        <section class="card border-0 shadow-sm">
          <div class="card-body d-flex justify-content-between flex-wrap gap-2 align-items-center">
            <div>
              <h2 class="h6 mb-1">Configuracoes de conta</h2>
              <p class="small text-secondary mb-0">Atualize seus dados de perfil e preferencia visual.</p>
            </div>
            <a class="btn btn-accent" href="configuracao.html">Abrir configuracao</a>
          </div>
        </section>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="server.js"></script>
  <script>
    MiniSocial.setupThemeControls();
    if (!MiniSocial.requireAuth()) {
      throw new Error('Auth required');
    }
    MiniSocial.renderAuthState();
    MiniSocial.setActiveNav();

    const user = MiniSocial.getCurrentUser();
    document.getElementById('fotoPerfil').src = MiniSocial.getProfilePhotoUrl(user);
    document.getElementById('nomePerfil').textContent = user.profile.name || user.username;
    document.getElementById('emailPerfil').textContent = user.email;
    document.getElementById('bioPerfil').textContent = user.profile.bio || 'Sem bio.';
    document.getElementById('interessesPerfil').textContent = user.profile.interests || 'Sem interesses cadastrados.';
  </script>
</body>
</html>
