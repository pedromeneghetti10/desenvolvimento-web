<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mini Rede Social | Configuracao</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <nav class="navbar navbar-expand-lg border-bottom sticky-top bg-body-tertiary">
    <div class="container">
      <a class="navbar-brand fw-bold" href="home.html">Mini Rede</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipal">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="menuPrincipal">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item"><a data-nav class="nav-link" href="home.html">Home</a></li>
          <li class="nav-item"><a data-nav class="nav-link" href="feed.html">Comentarios / Feed</a></li>
          <li class="nav-item"><a data-nav class="nav-link" href="perfil.html">Perfil</a></li>
          <li class="nav-item"><a data-nav class="nav-link" href="configuracao.html">Configuracao</a></li>
        </ul>
        <div class="d-flex gap-2 align-items-center">
          <button class="btn btn-outline-secondary btn-sm" data-theme-toggle>Tema</button>
          <span class="small text-secondary">Ola, <strong data-user-name></strong></span>
          <button class="btn btn-danger btn-sm" data-logout>Sair</button>
        </div>
      </div>
    </div>
  </nav>

  <main class="container py-4">
    <div class="row justify-content-center">
      <div class="col-xl-8">
        <section class="card border-0 shadow-sm">
          <div class="card-body p-4">
            <h1 class="h4 mb-3">Configuracao de perfil</h1>
            <form id="configForm" class="row g-3">
              <div class="col-md-6">
                <label class="form-label" for="nome">Nome</label>
                <input class="form-control" id="nome" required />
              </div>
              <div class="col-md-6">
                <label class="form-label" for="fotoArquivo">Foto de perfil</label>
                <input class="form-control" id="fotoArquivo" type="file" accept="image/*" />
                <img id="previewFoto" src="" alt="Pre-visualizacao da foto" class="rounded-circle border mt-2" style="width:72px;height:72px;object-fit:cover" />
              </div>
              <div class="col-12">
                <label class="form-label" for="bio">Bio / Informacoes Gerais</label>
                <textarea class="form-control" id="bio" rows="3"></textarea>
              </div>
              <div class="col-12">
                <label class="form-label" for="interesses">Interesses</label>
                <input class="form-control" id="interesses" />
              </div>
              <div class="col-md-6">
                <label class="form-label" for="tema">Preferencia visual (tema)</label>
                <select class="form-select" id="tema">
                  <option value="light">Claro</option>
                  <option value="dark">Escuro</option>
                </select>
              </div>
              <div class="col-12 d-flex gap-2">
                <button class="btn btn-accent" type="submit">Salvar alteracoes</button>
                <a class="btn btn-outline-secondary" href="perfil.html">Voltar ao perfil</a>
              </div>
            </form>
            <div id="feedback" class="small mt-3"></div>
          </div>
        </section>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="server.js"></script>
  <script>
    MiniSocial.setupThemeControls();
    if (!MiniSocial.requireAuth()) {
      throw new Error('Auth required');
    }
    MiniSocial.renderAuthState();
    MiniSocial.setActiveNav();

    const user = MiniSocial.getCurrentUser();
    const nomeEl = document.getElementById('nome');
    const fotoArquivoEl = document.getElementById('fotoArquivo');
    const previewEl = document.getElementById('previewFoto');
    const bioEl = document.getElementById('bio');
    const interessesEl = document.getElementById('interesses');
    const temaEl = document.getElementById('tema');

    function fileToDataUrl(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(String(reader.result || ''));
        reader.onerror = () => reject(new Error('Falha ao ler a imagem.'));
        reader.readAsDataURL(file);
      });
    }

    nomeEl.value = user.profile.name || user.username;
    previewEl.src = MiniSocial.getProfilePhotoUrl(user);
    bioEl.value = user.profile.bio || '';
    interessesEl.value = user.profile.interests || '';
    temaEl.value = localStorage.getItem(MiniSocial.KEYS.theme) || 'light';

    fotoArquivoEl.addEventListener('change', async function () {
      const file = fotoArquivoEl.files && fotoArquivoEl.files[0];
      if (!file) {
        previewEl.src = MiniSocial.getProfilePhotoUrl(MiniSocial.getCurrentUser());
        return;
      }

      try {
        previewEl.src = await fileToDataUrl(file);
      } catch {
        previewEl.src = MiniSocial.getProfilePhotoUrl(MiniSocial.getCurrentUser());
      }
    });

    document.getElementById('configForm').addEventListener('submit', async function (event) {
      event.preventDefault();
      const feedback = document.getElementById('feedback');

      let photoValue = user.profile.photo || '';
      const selectedFile = fotoArquivoEl.files && fotoArquivoEl.files[0];
      if (selectedFile) {
        try {
          photoValue = await fileToDataUrl(selectedFile);
        } catch {
          feedback.className = 'text-danger small mt-3';
          feedback.textContent = 'Nao foi possivel carregar a nova imagem.';
          return;
        }
      }

      const result = MiniSocial.updateCurrentUserProfile({
        name: nomeEl.value.trim(),
        photo: photoValue,
        bio: bioEl.value.trim(),
        interests: interessesEl.value.trim()
      });

      if (!result.ok) {
        feedback.className = 'text-danger small mt-3';
        feedback.textContent = result.message;
        return;
      }

      MiniSocial.applyTheme(temaEl.value);
      feedback.className = 'text-success small mt-3';
      feedback.textContent = 'Configuracoes atualizadas com sucesso.';
    });
  </script>
</body>
</html>
